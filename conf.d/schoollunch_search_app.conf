location /schoollunch_search_app/ {
    set $upstream http://schoollunch_search_app:8000;
    rewrite ^/schoollunch_search_app/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /schoollunch_search_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# ハイフンURLからアンダースコアURLへリダイレクト
location /schoollunch-search-app/ {
    return 301 /schoollunch_search_app/;
}
