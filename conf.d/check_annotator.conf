# Generated for check_annotator. Both services must join shared-gateway-net.
location = /check_annotator {
    set $upstream_app http://check_annotator-frontend:80;
    proxy_pass $upstream_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /check_annotator;
}

location = /check_annotator/api {
    return 308 /check_annotator/api/$is_args$args;
}

location /check_annotator/api/ {
    set $upstream_api http://check_annotator-backend:8000;
    rewrite ^/check_annotator/api/(.*)$ /api/$1 break;
    proxy_pass $upstream_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /check_annotator/ {
    set $upstream_app http://check_annotator-frontend:80;
    proxy_pass $upstream_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /check_annotator;
}
