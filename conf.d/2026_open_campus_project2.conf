location /2026_opencampus_project2/ {
    set $upstream http://172.26.0.1:5174;
    rewrite ^/2026_opencampus_project2/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /2026_opencampus_project2;
}
