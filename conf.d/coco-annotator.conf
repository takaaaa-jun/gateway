# Generated for coco-annotator. Both services must join shared-gateway-net.
location = /coco-annotator {
    set $upstream_app http://coco-annotator-frontend:80;
    proxy_pass $upstream_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /coco-annotator;
}

location = /coco-annotator/api {
    return 308 /coco-annotator/api/$is_args$args;
}

location /coco-annotator/api/ {
    client_max_body_size 64m;
    set $upstream_api http://coco-annotator-backend:8000;
    rewrite ^/coco-annotator/api/(.*)$ /api/$1 break;
    proxy_pass $upstream_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /coco-annotator/ {
    set $upstream_app http://coco-annotator-frontend:80;
    proxy_pass $upstream_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /coco-annotator;
}
